<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Emulator-Game</title>
    <style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        overflow: hidden;
    }
    #game-container {
        width: 100vw;
        height: 100vh;
    }
    canvas {
        /* 使用标准渲染，交由 WebGL 与 Shader 处理高清放大，彻底告别锯齿马赛克与模糊 */
        image-rendering: auto !important;
    }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script>
        // 1. 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const game = urlParams.get('game');
        let type = urlParams.get('type');

        if (type && type.includes('?')) {
            type = type.split('?')[0];
        }

        // 2. 基础全局配置
        window.EJS_DEBUG_XX = false;
        window.EJS_player = '#game';
        window.EJS_pathtodata = './ems/data/';
        window.EJS_language = 'en-US';

        // 【关键修复】禁用 localStorage 读取，防止浏览器记住之前导致马赛克/模糊的旧配置
        window.EJS_disableLocalStorage = true;

        // 3. 平台核心与路径映射表
        const coreMap = {
            'ps1': 'pcsx_rearmed',
            'playstation': 'pcsx_rearmed',
            'nes': 'fceumm',
            'snes': 'snes9x',
            'gb': 'gambatte',
            'gbc': 'gambatte',
            'gba': 'mgba',
            'nds': 'melonds',
            'n64': 'mupen64plus_next',
            'genesis': 'genesis_plus_gx',
            'sega': 'genesis_plus_gx',
            'segacd': 'genesis_plus_gx',
            'saturn': 'yabause',
            'neogeopocket': 'mednafen_ngp',
            'neogeopocketcolor': 'mednafen_ngp',
            'neogeo': 'fbneo',
            'arcade': 'fbneo'
        };

        const folderMap = {
            'mame': 'fbneo',
            'ps1': 'playstation',
            'playstation': 'playstation'
        };

        const coreType = type ? type.toLowerCase() : '';
        const mappedCore = coreMap[coreType] || coreType;
        window.EJS_core = mappedCore;

        if (game && type) {
            const folderName = folderMap[coreType] || coreType;
            window.EJS_gameUrl = `./roms/${folderName}/${game}`;
            console.log('Game URL:', window.EJS_gameUrl);
        }

        // 4. 全局核心默认配置（解决内存不足警告与画面渲染问题）
        window.EJS_settings = {
            "corePath": "./ems/data/cores/",
            "memorySize": 512,            // 最大分配内存 (MB)
            "initialMemorySize": 256,     // 【关键修复】提升初始堆内存为 256MB，解决解压 ROM 时的内存扩容警告
            "frameRate": 60,
            "fastForward": true,
            "slowMotion": false,
            "rewindEnabled": "enabled",
            "cheatsEnabled": false,
            "videoSmooth": true,           // 开启全局硬件级渲染平滑
            "autoFrameSkip": true,
            "frameSkip": 0
        };

        // 5. 各机种针对性优化设置
        if (coreType === 'ps1' || coreType === 'playstation') {
            window.EJS_biosUrl = "./bios/scph5502.bin";
            window.EJS_settings = {
                ...window.EJS_settings,
                "pcsx_rearmed_gpu": "gpu_unai",
                "pcsx_rearmed_resolution": 2,
                "pcsx_rearmed_dithering": "disabled",
                "initialMemorySize": 256,
                "pcsx_rearmed_frameskip": 0
            };

            fetch('./bios/scph5502.bin', { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) {
                        window.EJS_biosUrl = "./bios/scph5501.bin";
                    }
                })
                .catch(() => {
                    window.EJS_biosUrl = "./bios/scph5501.bin";
                });
        }
        else if (coreType === 'gba') {
            window.EJS_biosUrl = "./bios/gba_bios.bin";
            window.EJS_settings = {
                ...window.EJS_settings,
                "mgba_interframe_blending": false,
                "mgba_video_color_correction": "enabled",
                "mgba_lcd_ghosting": "disabled",
                "mgba_fps": 60
            };
        }
        else if (coreType === 'gb' || coreType === 'gbc') {
            window.EJS_biosUrl = "./bios/gbc_bios.bin";
            window.EJS_settings = {
                ...window.EJS_settings,
                "gambatte_gb_internal_palette": "optimized",
                "gambatte_mix_frames": "disabled"
            };
        }
        else if (coreType === 'segacd') {
            window.EJS_biosUrl = "./bios/bios_CD_U.bin";
        }
        else if (coreType === 'saturn') {
            window.EJS_biosUrl = "./bios/saturn_bios.bin";
        }
        else if (coreType === 'nds') {
            window.EJS_biosUrl = "./bios/bios7.bin";
            window.EJS_settings = {
                ...window.EJS_settings,
                "initialMemorySize": 256,
                "melonds_fps": 60
            };

            fetch('./bios/bios7.bin', { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) {
                        window.EJS_biosUrl = "./bios/bios9.bin";
                        return fetch('./bios/bios9.bin', { method: 'HEAD' });
                    }
                })
                .then(response => {
                    if (response && !response.ok) {
                        window.EJS_biosUrl = "./bios/firmware.bin";
                    }
                });
        }
        else if (coreType === 'neogeopocket' || coreType === 'neogeopocketcolor') {
            window.EJS_biosUrl = "./bios/Neo-Geo_Pocket_Color.bin";
            fetch('./bios/Neo-Geo_Pocket_Color.bin', { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) {
                        window.EJS_biosUrl = "./bios/Neo-Geo_Pocket.bin";
                    }
                })
                .catch(() => {
                    window.EJS_biosUrl = "./bios/Neo-Geo_Pocket.bin";
                });
        }

        // 6. Arcade / FBNeo / NeoGeo 模式高清渲染优化
        if (coreType === 'mame' || coreType === 'fbneo' || coreType === 'arcade' || coreType === 'neogeo') {
            window.EJS_settings = {
                ...window.EJS_settings,
                "webgl2Enabled": "enabled",
                "videoSmooth": true,             // 开启双线性平滑插值
                "fbneo-neogeo-mode": "UNIBIOS",
                "fbneo-cpu-speed-adjust": 100,
                "fbneo-frameskip": 0,
                "fbneo-interpolation": 1,        // 开启 FBNeo 核心纹理增强
                "shader": "sabr"                 // 【核心修改】启用 SABR 矢量渲染滤镜，消除像素马赛克同时保持字体清晰
            };

            window.EJS_biosUrl = "./bios/neogeo.zip";
            console.log("NeoGeo/Arcade mode: Using neogeo.zip BIOS from", window.EJS_biosUrl);

            if (game && game.includes('mslug6')) {
                window.EJS_biosUrl = "./bios/awbios.zip";
            }
        }
    </script>
    <script src="./ems/data/loader.js"></script>
</body>
</html>
