<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Emulator-Game</title>
    <style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        overflow: hidden;
    }
    #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 强制重写 Canvas 样式，消除锯齿方块 */
    canvas {
        image-rendering: auto !important;
        image-rendering: smooth !important;
        image-rendering: high-quality !important;
        transform: translateZ(0);
    }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const game = urlParams.get('game');
        let type = urlParams.get('type');

        if (type && type.includes('?')) {
            type = type.split('?')[0];
        }

        const coreMap = {
            'ps1': 'pcsx_rearmed', 'playstation': 'pcsx_rearmed',
            'nes': 'fceumm', 'snes': 'snes9x',
            'gb': 'gambatte', 'gbc': 'gambatte', 'gba': 'mgba',
            'nds': 'melonds', 'n64': 'mupen64plus_next',
            'genesis': 'genesis_plus_gx', 'sega': 'genesis_plus_gx',
            'segacd': 'genesis_plus_gx', 'saturn': 'yabause',
            'neogeopocket': 'mednafen_ngp', 'neogeopocketcolor': 'mednafen_ngp',
            'neogeo': 'fbneo', 'arcade': 'fbneo'
        };

        const folderMap = { 'mame': 'fbneo', 'ps1': 'playstation', 'playstation': 'playstation' };
        const coreType = type ? type.toLowerCase() : '';

        // --- 全局根配置打平绑定 ---
        window.EJS_player = '#game';
        window.EJS_pathtodata = './ems/data/';
        window.EJS_language = 'en-US';
        window.EJS_core = coreMap[coreType] || coreType;
        window.EJS_disableLocalStorage = true; // 清除错乱的缓存

        if (game && type) {
            const folderName = folderMap[coreType] || coreType;
            window.EJS_gameUrl = `./roms/${folderName}/${game}`;
        }

        // BIOS 自动匹配
        if (coreType === 'mame' || coreType === 'fbneo' || coreType === 'arcade' || coreType === 'neogeo') {
            window.EJS_biosUrl = "./bios/neogeo.zip";
            if (game && game.includes('mslug6')) window.EJS_biosUrl = "./bios/awbios.zip";
        }

        // --- 强制插值与硬件平滑设置 (正确写法) ---
        window.EJS_videoSmooth = true; // 强制开启视频平滑插值
        window.EJS_threads = true;     // 开启多线程运算加速渲染

        // 监听渲染完成，强制修改 WebGL 上下文平滑度
        window.EJS_onGameStart = function() {
            setTimeout(() => {
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    canvas.style.setProperty('image-rendering', 'smooth', 'important');
                    canvas.style.setProperty('image-rendering', 'auto', 'important');
                    const ctx = canvas.getContext('2d') || canvas.getContext('webgl') || canvas.getContext('webgl2');
                    if (ctx && ctx.imageSmoothingEnabled !== undefined) {
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                    }
                }
            }, 500);
        };
    </script>
    <script src="./ems/data/loader.js"></script>
</body>
</html>
