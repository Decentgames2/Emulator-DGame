<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="./coi-serviceworker.js"></script>
    <title>Emulator-Game</title>
    <style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        overflow: hidden;
    }
    #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    /* 隐藏原始像素 Canvas */
    #game canvas {
        display: none !important;
    }
    /* 显示矢量算法重构后的 Canvas */
    #hd-canvas {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        image-rendering: auto;
    }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
        <canvas id="hd-canvas"></canvas>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const game = urlParams.get('game');
        let type = urlParams.get('type');

        if (type && type.includes('?')) {
            type = type.split('?')[0];
        }

        const coreMap = {
            'ps1': 'pcsx_rearmed', 'playstation': 'pcsx_rearmed',
            'nes': 'fceumm', 'snes': 'snes9x',
            'gb': 'gambatte', 'gbc': 'gambatte', 'gba': 'mgba',
            'nds': 'melonds', 'n64': 'mupen64plus_next',
            'genesis': 'genesis_plus_gx', 'sega': 'genesis_plus_gx',
            'segacd': 'genesis_plus_gx', 'saturn': 'yabause',
            'neogeopocket': 'mednafen_ngp', 'neogeopocketcolor': 'mednafen_ngp',
            'neogeo': 'fbneo', 'arcade': 'fbneo'
        };

        const folderMap = { 'mame': 'fbneo', 'ps1': 'playstation', 'playstation': 'playstation' };
        const coreType = type ? type.toLowerCase() : '';

        window.EJS_player = '#game';
        window.EJS_pathtodata = './ems/data/';
        window.EJS_language = 'en-US';
        window.EJS_core = coreMap[coreType] || coreType;
        window.EJS_disableLocalStorage = true;

        if (game && type) {
            const folderName = folderMap[coreType] || coreType;
            window.EJS_gameUrl = `./roms/${folderName}/${game}`;
        }

        if (coreType === 'mame' || coreType === 'fbneo' || coreType === 'arcade' || coreType === 'neogeo') {
            window.EJS_biosUrl = "./bios/neogeo.zip";
            if (game && game.includes('mslug6')) window.EJS_biosUrl = "./bios/awbios.zip";
        }

        window.EJS_threads = !!window.crossOriginIsolated;
        window.EJS_videoSmooth = false;

        // --- 核心矢量渲染引擎（HQ2X Pixel Vectorizer） ---
        window.EJS_onGameStart = function() {
            const hdCanvas = document.getElementById('hd-canvas');
            const hdCtx = hdCanvas.getContext('2d');

            const checkSourceCanvas = setInterval(() => {
                const srcCanvas = document.querySelector('#game canvas');
                if (srcCanvas && srcCanvas.width > 0) {
                    clearInterval(checkSourceCanvas);

                    const w = srcCanvas.width;
                    const h = srcCanvas.height;

                    // 输出 Canvas 分辨率倍增
                    hdCanvas.width = w * 2;
                    hdCanvas.height = h * 2;

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = w;
                    tempCanvas.height = h;
                    const tempCtx = tempCanvas.getContext('2d');

                    // 逐帧 HQ2X 算法重构成像
                    function processVectorFrame() {
                        if (srcCanvas.width > 0) {
                            tempCtx.drawImage(srcCanvas, 0, 0);
                            const srcData = tempCtx.getImageData(0, 0, w, h);
                            const dstData = hdCtx.createImageData(w * 2, h * 2);

                            const src = new Uint32Array(srcData.data.buffer);
                            const dst = new Uint32Array(dstData.data.buffer);

                            // HQ2X 矢量插值平滑处理
                            for (let y = 0; y < h; y++) {
                                for (let x = 0; x < w; x++) {
                                    const i = y * w + x;
                                    const p = src[i];

                                    // 获取周边邻域像素
                                    const pUp = y > 0 ? src[i - w] : p;
                                    const pDown = y < h - 1 ? src[i + w] : p;
                                    const pLeft = x > 0 ? src[i - 1] : p;
                                    const pRight = x < w - 1 ? src[i + 1] : p;

                                    const outI = (y * 2) * (w * 2) + (x * 2);

                                    // 计算矢量边缘插值
                                    dst[outI] = (p === pUp && p === pLeft) ? p : blend(p, pUp, pLeft);
                                    dst[outI + 1] = (p === pUp && p === pRight) ? p : blend(p, pUp, pRight);
                                    dst[outI + (w * 2)] = (p === pDown && p === pLeft) ? p : blend(p, pDown, pLeft);
                                    dst[outI + (w * 2) + 1] = (p === pDown && p === pRight) ? p : blend(p, pDown, pRight);
                                }
                            }
                            hdCtx.putImageData(dstData, 0, 0);
                        }
                        requestAnimationFrame(processVectorFrame);
                    }

                    // RGB 颜色矢量混色函数
                    function blend(c1, c2, c3) {
                        const r = (((c1 & 0xFF) + (c2 & 0xFF) + (c3 & 0xFF)) / 3) & 0xFF;
                        const g = ((((c1 >> 8) & 0xFF) + ((c2 >> 8) & 0xFF) + ((c3 >> 8) & 0xFF)) / 3) & 0xFF;
                        const b = ((((c1 >> 16) & 0xFF) + ((c2 >> 16) & 0xFF) + ((c3 >> 16) & 0xFF)) / 3) & 0xFF;
                        const a = (c1 >> 24) & 0xFF;
                        return (a << 24) | (b << 16) | (g << 8) | r;
                    }

                    requestAnimationFrame(processVectorFrame);
                }
            }, 100);
        };
    </script>
    <script src="./ems/data/loader.js"></script>
</body>
</html>
